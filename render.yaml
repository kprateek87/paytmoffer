
services:
  - type: worker
    name: cashback-review-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    disk:
      name: customer-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        value: "1985033905"
      - key: DB_PATH
        value: /var/data/customers.db
        
